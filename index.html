<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>MyShop</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Welcome to MyShop Testing</h2>
            <p>Simple products. Great prices.</p>
        </section>

        <section class="product">
            <div class="product-image">🎧</div>

            <div class="product-info">
                <h2>Premium Headphones</h2>
                <p>High-quality wireless headphones for everyday use.</p>
                <p class="price">€49.99</p>

                <button id="buyButton">Add to Cart</button>

                <p id="message"></p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 MyShop</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
